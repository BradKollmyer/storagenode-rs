# aes 0.8 / polyval only use ARMv8 AES and PMULL when these cfgs are set.
# x86_64 autodetects AES-NI. Same flags as storj-uplink.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]

# Keep `cargo update` on the workspace MSRV. Caret ranges in aws-sdk-s3
# otherwise select smithy crates that need Rust 1.94.
[resolver]
incompatible-rust-versions = "fallback"

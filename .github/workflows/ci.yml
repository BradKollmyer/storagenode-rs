name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # crates/storagenode path-depends on ../../../uplink-rs, the sibling
      # of this checkout: $GITHUB_WORKSPACE/../uplink-rs. The ref is a commit,
      # not main: a path dependency bypasses Cargo.lock, so it must not move
      # under a passing build. Bump it on purpose.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BradKollmyer/uplink-rs
          ref: bb320c052fa808bfe60d683de167af47421544e9
          path: uplink-rs
      - name: Place uplink-rs beside this repo
        run: mv uplink-rs "${GITHUB_WORKSPACE}/../uplink-rs"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

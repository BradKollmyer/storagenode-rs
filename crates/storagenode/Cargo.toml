[package]
name = "storagenode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Storj storage node: identity, DRPC, and the piece store"
publish = false

[dependencies]
base64 = "0.22"
prost = "0.14"
prost-types = "0.14"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-getrandom", "use-curve25519", "use-aes-gcm", "use-chacha20poly1305", "use-blake2"] }
s3store = { path = "../s3store" }
storj-proto = { path = "../../../storj-uplink/crates/storj-proto" }
storj-rpc = { path = "../../../storj-uplink/crates/storj-rpc" }
storj-uplink = { path = "../../../storj-uplink/crates/storj-uplink" }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
s3s = "0.12"
s3s-fs = "0.12"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "3"

[lints]
workspace = true

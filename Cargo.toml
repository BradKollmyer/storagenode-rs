[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# 1.123 raises MSRV past 1.88. Exact pin: caret 1.122 still allows 1.129.
# `rustls` is the legacy hyper 0.14 connector (rustls 0.21, webpki 0.101).
# HTTPS uses `default-https-client` (rustls 0.23).
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# s3s 0.12 pins RustCrypto pre-releases that Cargo will not duplicate next to
# the stable sha2 0.11 / hmac 0.13 that storj-rpc and storj-uplink require.
[patch.crates-io]
s3s = { path = "third_party/s3s" }

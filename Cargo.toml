[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# 1.123 raises MSRV past 1.88. Exact pin: caret 1.122 still allows 1.129.
aws-sdk-s3 = { version = "=1.122.0" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
